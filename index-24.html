<!doctype html>
<html lang="es">
<head>

<title>PELAGIC — Cinematic Ocean</title>
<style>
  :root { color-scheme: dark; --glass:rgba(6,17,27,.56); --edge:rgba(203,230,238,.16); --text:#e9f4f6; --muted:#93abb5; --accent:#77d6d0; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#05131e; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); }
  #stage { position:fixed; inset:0; overflow:hidden; background:linear-gradient(#193b50,#c17b55 47%,#0a3545 50%,#041822 100%); }
  #stage canvas { display:block; width:100%; height:100%; outline:none; touch-action:none; }
  .vignette { pointer-events:none; position:absolute; inset:0; background:linear-gradient(180deg,rgba(2,10,18,.24),transparent 22%,transparent 63%,rgba(1,8,14,.22)),radial-gradient(ellipse at 50% 48%,transparent 45%,rgba(0,7,14,.25) 100%); }
  .topline { position:absolute; left:clamp(14px,3vw,42px); top:clamp(14px,3vh,34px); display:flex; gap:12px; align-items:center; pointer-events:none; }
  .mark { width:39px;height:39px;border:1px solid rgba(153,226,225,.58);border-radius:12px;display:grid;place-items:center;background:rgba(5,23,33,.42);box-shadow:0 5px 25px #0002; }
  .mark svg { width:25px;height:25px; }
  .brand { font-size:12px; letter-spacing:.24em; font-weight:760; line-height:1.35; }
  .subbrand { color:rgba(222,241,244,.63);font-size:9px;letter-spacing:.17em;margin-top:4px; }
  .status { position:absolute; right:clamp(14px,3vw,42px);top:clamp(17px,3.2vh,36px); display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--edge);border-radius:100px;background:rgba(3,16,26,.38);backdrop-filter:blur(16px);font-size:10px;letter-spacing:.1em;color:#cfdee2; }
  .dot { width:6px;height:6px;border-radius:50%;background:#7ce0c6;box-shadow:0 0 12px #7ce0c699; }
  .right-bottom { position:absolute;right:clamp(15px,3vw,42px);bottom:clamp(20px,4vh,45px);text-align:right;pointer-events:none; }
  .fps { font-size:18px;font-variant-numeric:tabular-nums;font-weight:620;letter-spacing:-.03em;text-shadow:0 2px 15px #001; }
  .fps small { font-size:9px;letter-spacing:.16em;color:#b7cbd0;font-weight:500; }
  .caption { color:rgba(221,235,238,.62);font-size:9px;letter-spacing:.12em;margin-top:6px; }
  .bottom-center { position:absolute;bottom:clamp(18px,4vh,44px);left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.13em;color:rgba(225,240,242,.48);pointer-events:none;white-space:nowrap;text-shadow:0 2px 10px #001; }
  @media(max-width:600px) { .bottom-center { display:none; } .right-bottom { bottom:14px;right:15px; } .fps { font-size:15px; } .status { font-size:9px;padding:8px 10px; } .topline { top:14px;left:14px; } .mark { width:34px;height:34px; } }
</style>

<body>
<div id="stage" aria-label="Mar abierto animado"></div>
<div class="vignette"></div>
<div class="topline">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M3 11.5C7.4 8.3 11.8 8.3 16.2 11.5C20.5 14.7 24.7 14.7 29 11.5M3 17C7.4 13.8 11.8 13.8 16.2 17C20.5 20.2 24.7 20.2 29 17M3 22.5C7.4 19.3 11.8 19.3 16.2 22.5C20.5 25.7 24.7 25.7 29 22.5" stroke="#9BE4DF" stroke-width="1.5" stroke-linecap="round"/><circle cx="23.2" cy="5.3" r="2" fill="#E9C49B"/></svg></div>
  <div><div class="brand">PELAGIC<span style="color:#80d6d0"> / </span>OCEAN</div><div class="subbrand">REAL-TIME WATER STUDY · 01</div></div>
</div>
<div class="status"><span class="dot" id="statusDot"></span><span id="statusText">PREPARANDO OCÉANO</span></div>
<div class="right-bottom"><div class="fps"><span id="fpsValue">—</span> <small>FPS</small></div><div class="caption" id="renderMode">OLEAJE MEDIO · CALIDAD ADAPTATIVA</div></div>
<div class="bottom-center">MAREA MEDIA · LUZ ATMOSFÉRICA · OCÉANO PROCEDURAL</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script>
(() => {
  const stage = document.getElementById('stage');
  const statusText = document.getElementById('statusText');
  const statusDot = document.getElementById('statusDot');
  const fpsValue = document.getElementById('fpsValue');
  const renderMode = document.getElementById('renderMode');
  // Fixed ocean preset: moderate, visible swell without aggressive breaking waves.
  const settings = Object.freeze({ wind: .78, waves: .84, foam: .62 });
  const defaultView = { yaw: 0, pitch: -.09, height: 4.0, z: 13.5 };
  let view = {...defaultView};
  let engine = null;
  let currentFps = 60;
  let lastFrame = performance.now(), sampleElapsed = 0, sampleFrames = 0;
  let slowSeconds = 0, fastSeconds = 0;
  let quality = 'auto';
  function updateFps(dt) {
    sampleElapsed += dt; sampleFrames++;
    if (sampleElapsed >= .5) {
      currentFps = sampleFrames / sampleElapsed;
      fpsValue.textContent = Math.round(currentFps).toString();
      if (quality === 'auto' && engine && engine.setDpr) {
        if (currentFps < 44) { slowSeconds += sampleElapsed; fastSeconds = 0; }
        else if (currentFps > 58) { fastSeconds += sampleElapsed; slowSeconds = 0; }
        else { slowSeconds = Math.max(0, slowSeconds - sampleElapsed * .5); fastSeconds = 0; }
        if (slowSeconds >= 2.2) { engine.setDpr(Math.max(.85, engine.dpr - .12)); slowSeconds = 0; }
        if (fastSeconds >= 6 && engine.dpr < engine.maxDpr) { engine.setDpr(Math.min(engine.maxDpr, engine.dpr + .08)); fastSeconds = 0; }
      }
      sampleElapsed = 0; sampleFrames = 0;
    }
  }
  function onPointerControls(canvas, applyView) {
    let pointer = null, px = 0, py = 0, pinchDistance = 0;
    const pointers = new Map();
    canvas.addEventListener('pointerdown', e => {
      pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
      if (pointers.size === 1) { pointer=e.pointerId; px=e.clientX; py=e.clientY; }
      if (pointers.size === 2) { const a=[...pointers.values()]; pinchDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); pointer=null; }
      canvas.setPointerCapture?.(e.pointerId);
    });
    canvas.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if (pointers.size===1 && pointer===e.pointerId) {
        view.yaw -= (e.clientX-px)*.0038; view.pitch += (e.clientY-py)*.0026;
        view.pitch=Math.max(-.42,Math.min(.11,view.pitch)); px=e.clientX; py=e.clientY; applyView();
      } else if (pointers.size===2) {
        const a=[...pointers.values()], next=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
        if (pinchDistance>0) { const delta=(pinchDistance-next)*.018; view.height=Math.max(2.6,Math.min(8.5,view.height+delta)); view.z=13.5+(view.height-4.0)*1.05; applyView(); }
        pinchDistance=next;
      }
    });
    const end = e => { pointers.delete(e.pointerId); if(pointer===e.pointerId) pointer=null; if(pointers.size<2) pinchDistance=0; };
    canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end); canvas.addEventListener('lostpointercapture',end);
    canvas.addEventListener('wheel',e=>{ e.preventDefault(); view.height=Math.max(2.6,Math.min(8.5,view.height+Math.sign(e.deltaY)*.45)); view.z=13.5+(view.height-4.0)*1.05; applyView(); },{passive:false});
  }

  async function loadThree() {
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Tiempo de espera agotado al cargar Three.js')), 12000));
    const modules = await Promise.race([
      Promise.all([
        import('three'),
        import('three/addons/objects/Water.js'),
        import('three/addons/objects/Sky.js')
      ]),
      timeout
    ]);
    return { THREE: modules[0], Water: modules[1].Water, Sky: modules[2].Sky };
  }
  async function init() {
    statusText.textContent = 'CARGANDO THREE.JS';
    try { initThree(await loadThree()); }
    catch (error) { console.warn('Three.js no disponible; se activa el renderizador WebGL de compatibilidad.', error); initFallback(); }
  }

  function createWaterNormals(THREE, size = 256) {
    // Seamless fractal height field: smooth periodic noise breaks the tiled, synthetic look
    // of a stack of regular sine waves without needing an external texture.
    let seed = 0x51f15e;
    const random = () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    const grids = [
      { w: 4, h: 3, a: .38 },
      { w: 9, h: 6, a: .27 },
      { w: 18, h: 13, a: .17 },
      { w: 35, h: 25, a: .11 },
      { w: 67, h: 43, a: .07 }
    ].map(g => {
      g.data = new Float32Array(g.w * g.h);
      for (let i = 0; i < g.data.length; i++) g.data[i] = random();
      return g;
    });
    const smooth01 = x => x * x * (3 - 2 * x);
    function gridNoise(g, u, v) {
      u -= Math.floor(u); v -= Math.floor(v);
      const x = u * g.w, y = v * g.h;
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = smooth01(x - ix), fy = smooth01(y - iy);
      const ix1 = (ix + 1) % g.w, iy1 = (iy + 1) % g.h;
      const ix0 = ix % g.w, iy0 = iy % g.h;
      const a = g.data[iy0 * g.w + ix0], b = g.data[iy0 * g.w + ix1];
      const c = g.data[iy1 * g.w + ix0], d = g.data[iy1 * g.w + ix1];
      return (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
    }
    function heightField(u, v) {
      let value = 0;
      for (const g of grids) value += g.a * gridNoise(g, u, v);
      return value;
    }
    const data = new Uint8Array(size * size * 4);
    const du = 1 / size;
    for (let y = 0; y < size; y++) {
      const v = y / size;
      for (let x = 0; x < size; x++) {
        const u = x / size;
        const dx = (heightField(u + du, v) - heightField(u - du, v)) / (2 * du);
        const dy = (heightField(u, v + du) - heightField(u, v - du)) / (2 * du);
        let nx = -dx * .075, ny = -dy * .075, nz = 1;
        const inv = 1 / Math.hypot(nx, ny, nz); nx *= inv; ny *= inv; nz *= inv;
        const i = (y * size + x) * 4;
        data[i] = Math.round((nx * .5 + .5) * 255);
        data[i + 1] = Math.round((ny * .5 + .5) * 255);
        data[i + 2] = Math.round((nz * .5 + .5) * 255);
        data[i + 3] = 255;
      }
    }
    const texture = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    texture.magFilter = THREE.LinearFilter;
    texture.minFilter = THREE.LinearMipmapLinearFilter;
    texture.generateMipmaps = true;
    texture.colorSpace = THREE.NoColorSpace;
    texture.needsUpdate = true;
    return texture;
  }

  function createCloudNoiseTexture(THREE, width = 512, height = 256) {
    // Build a tileable multi-scale noise atlas once on the CPU. Sampling this texture is
    // far cheaper than evaluating dozens of 3-D noise hashes for every sky pixel.
    let seed = 0x37c4a91;
    const random = () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    const grids = [
      { w: 4, h: 3 }, { w: 8, h: 5 }, { w: 16, h: 10 },
      { w: 32, h: 20 }, { w: 64, h: 40 }, { w: 128, h: 80 }
    ].map(g => ({ ...g, data: Float32Array.from({ length: g.w * g.h }, random) }));
    const smooth01 = x => x * x * (3 - 2 * x);
    function sampleGrid(g, u, v) {
      u -= Math.floor(u); v -= Math.floor(v);
      const x = u * g.w, y = v * g.h;
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = smooth01(x - ix), fy = smooth01(y - iy);
      const x0 = ix % g.w, x1 = (ix + 1) % g.w;
      const y0 = iy % g.h, y1 = (iy + 1) % g.h;
      const a = g.data[y0 * g.w + x0], b = g.data[y0 * g.w + x1];
      const c = g.data[y1 * g.w + x0], d = g.data[y1 * g.w + x1];
      return (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
    }
    const data = new Uint8Array(width * height * 4);
    const broadWeights = [0.45, 0.26, 0.15, 0.08, 0.06, 0.00];
    const detailWeights = [0.00, 0.04, 0.13, 0.24, 0.30, 0.29];
    const fineWeights = [0.00, 0.00, 0.06, 0.18, 0.31, 0.45];
    for (let y = 0; y < height; y++) {
      const v = y / height;
      for (let x = 0; x < width; x++) {
        const u = x / width;
        const n0 = sampleGrid(grids[0], u, v), n1 = sampleGrid(grids[1], u, v);
        const n2 = sampleGrid(grids[2], u, v), n3 = sampleGrid(grids[3], u, v);
        const n4 = sampleGrid(grids[4], u, v), n5 = sampleGrid(grids[5], u, v);
        const r = n0 * 0.45 + n1 * 0.26 + n2 * 0.15 + n3 * 0.08 + n4 * 0.06;
        const g = n1 * 0.04 + n2 * 0.13 + n3 * 0.24 + n4 * 0.30 + n5 * 0.29;
        const b = n2 * 0.06 + n3 * 0.18 + n4 * 0.31 + n5 * 0.45;
        const idx = (y * width + x) * 4;
        data[idx] = Math.round(r * 255);
        data[idx + 1] = Math.round(g * 255);
        data[idx + 2] = Math.round(b * 255);
        data[idx + 3] = 255;
      }
    }
    const texture = new THREE.DataTexture(data, width, height, THREE.RGBAFormat);
    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    texture.magFilter = THREE.LinearFilter;
    texture.minFilter = THREE.LinearMipmapLinearFilter;
    texture.generateMipmaps = true;
    texture.colorSpace = THREE.NoColorSpace;
    texture.needsUpdate = true;
    return texture;
  }

  function addProceduralWaveDisplacement(water) {
    // Patch the standard Water shaders with restrained geometric swell and foam.
    // The normal texture adds fine ripples; crest foam is subtle and fades with distance.
    let vertexShader = water.material.vertexShader;
    let fragmentShader = water.material.fragmentShader;
    const mainTag = 'void main() {';
    const mirrorTag = 'mirrorCoord = modelMatrix * vec4( position, 1.0 );';
    const viewTag = 'vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );';
    const foamTag = 'vec3 outgoingLight = albedo;';
    if (!vertexShader.includes(mainTag) || !vertexShader.includes(mirrorTag) || !vertexShader.includes(viewTag)) {
      console.warn('Water.js cambió la plantilla del vértice; se conserva el oleaje normal-map.');
      water.material.uniforms.uWaveStrength = { value: settings.waves };
      return false;
    }
    const declarations = ( /uniform\s+float\s+time\s*;/.test(vertexShader.split(mainTag)[0]) ? '' : 'uniform float time;\n' ) + 'uniform float uWaveStrength;\nvarying vec2 vWaveSlope;\n';
    vertexShader = vertexShader.replace(mainTag, declarations + mainTag);
    vertexShader = vertexShader.replace(mirrorTag, `
      vec3 displacedPosition = position;
      vec2 baseP = vec2(position.x, -position.y);
      float t = time;
      // Subtle domain warping makes crest lines meander instead of reading as parallel sine strips.
      float warpA = baseP.y*.018 + t*.09;
      float warpB = baseP.y*.047 - t*.15;
      float warpC = baseP.x*.016 - t*.10;
      float warpD = baseP.x*.039 + baseP.y*.011 + t*.13;
      float warpX = 3.40*sin(warpA) + 1.40*sin(warpB);
      float warpZ = 2.80*sin(warpC) + .90*sin(warpD);
      float warpX_dz = 3.40*.018*cos(warpA) + 1.40*.047*cos(warpB);
      float warpZ_dx = 2.80*.016*cos(warpC) + .90*.039*cos(warpD);
      float warpZ_dz = .90*.011*cos(warpD);
      vec2 p = baseP + vec2(warpX, warpZ);
      float p1 = dot(p, vec2(.050,.022)) + t*.62;
      float p2 = dot(p, vec2(-.037,.091)) + t*.91 + 1.17;
      float p3 = dot(p, vec2(.132,-.096)) + t*1.13 + 2.36;
      float p4 = dot(p, vec2(-.172,-.142)) + t*1.43 + .42;
      float p5 = dot(p, vec2(.27,-.205)) + t*1.72 + 1.8;
      float p6 = dot(p, vec2(-.088,.182)) + t*.77 + .87;
      float p7 = dot(p, vec2(.33,.052)) + t*1.92 + 2.08;
      float p8 = dot(p, vec2(-.214,.276)) + t*.83 + 2.61;
      float p9 = dot(p, vec2(.342,.173)) + t*2.03 + .38;
      float p10 = dot(p, vec2(-.284,-.233)) + t*1.57 + 4.05;
      float s1=sin(p1), s2=sin(p2), s3=sin(p3), s4=sin(p4), s5=sin(p5), s6=sin(p6), s7=sin(p7), s8=sin(p8), s9=sin(p9), s10=sin(p10);
      float c1=cos(p1), c2=cos(p2), c3=cos(p3), c4=cos(p4), c5=cos(p5), c6=cos(p6), c7=cos(p7), c8=cos(p8), c9=cos(p9), c10=cos(p10);
      float h = .59*s1 + .31*s2 + .165*s3 + .085*s4 + .033*s5 + .055*s6 + .024*s7 + .045*s8 + .023*s9 + .016*s10;
      displacedPosition.z = h * uWaveStrength;
      // Low-steepness horizontal drift keeps crests rounded without making the sea stormy.
      float horizontalX = .22*(.59*.915*c1 + .31*(-.377)*c2 + .165*.808*c3 + .085*(-.771)*c4 + .033*.796*c5 + .055*(-.435)*c6 + .024*.988*c7 + .045*(-.613)*c8 + .023*.892*c9 + .016*(-.773)*c10) * uWaveStrength;
      float horizontalZ = .22*(.59*.403*c1 + .31*.927*c2 + .165*(-.588)*c3 + .085*(-.636)*c4 + .033*(-.605)*c5 + .055*.900*c6 + .024*.156*c7 + .045*.790*c8 + .023*.452*c9 + .016*(-.634)*c10) * uWaveStrength;
      displacedPosition.x += horizontalX;
      displacedPosition.y -= horizontalZ;
      float dhdx = .59*c1*(.050 + .022*warpZ_dx) + .31*c2*(-.037 + .091*warpZ_dx) + .165*c3*(.132 - .096*warpZ_dx) + .085*c4*(-.172 - .142*warpZ_dx) + .033*c5*(.27 - .205*warpZ_dx) + .055*c6*(-.088 + .182*warpZ_dx) + .024*c7*(.33 + .052*warpZ_dx) + .045*c8*(-.214 + .276*warpZ_dx) + .023*c9*(.342 + .173*warpZ_dx) + .016*c10*(-.284 - .233*warpZ_dx);
      float dhdz = .59*c1*(.050*warpX_dz + .022*(1.0+warpZ_dz)) + .31*c2*(-.037*warpX_dz + .091*(1.0+warpZ_dz)) + .165*c3*(.132*warpX_dz - .096*(1.0+warpZ_dz)) + .085*c4*(-.172*warpX_dz - .142*(1.0+warpZ_dz)) + .033*c5*(.27*warpX_dz - .205*(1.0+warpZ_dz)) + .055*c6*(-.088*warpX_dz + .182*(1.0+warpZ_dz)) + .024*c7*(.33*warpX_dz + .052*(1.0+warpZ_dz)) + .045*c8*(-.214*warpX_dz + .276*(1.0+warpZ_dz)) + .023*c9*(.342*warpX_dz + .173*(1.0+warpZ_dz)) + .016*c10*(-.284*warpX_dz - .233*(1.0+warpZ_dz));
      vWaveSlope = vec2(dhdx, dhdz) * uWaveStrength;
      mirrorCoord = modelMatrix * vec4(displacedPosition, 1.0);`);
    vertexShader = vertexShader.replace(viewTag, 'vec4 mvPosition = modelViewMatrix * vec4( displacedPosition, 1.0 );');

    // r180 Water exposes these stable material outputs. If upstream ever changes them,
    // geometric waves still work without risking a broken shader program.
    if (fragmentShader.includes(foamTag) && fragmentShader.includes('uniform sampler2D normalSampler;')) {
      fragmentShader = fragmentShader.replace(mainTag, 'uniform float uWaveStrength;\nuniform float uFoamStrength;\nvarying vec2 vWaveSlope;\n' + mainTag);
      const normalLine = /vec3 surfaceNormal = normalize\(\s*noise\.xzy \* vec3\(\s*1\.5,\s*1\.0,\s*1\.5\s*\)\s*\);/;
      if (normalLine.test(fragmentShader)) {
        fragmentShader = fragmentShader.replace(normalLine, `vec3 surfaceNormal = normalize( noise.xzy * vec3( 1.5, 1.0, 1.5 ) );\n      vec3 swellNormal = normalize(vec3(-vWaveSlope.x, 1.0, -vWaveSlope.y));\n      float normalDetailFade = 1.0 - smoothstep(80.0, 420.0, length(eye - worldPosition.xyz));
      surfaceNormal = normalize(swellNormal + (surfaceNormal - vec3(0.0, 1.0, 0.0)) * mix(0.32, 0.72, normalDetailFade));`);
      } else { console.warn('No se encontró la normal base del shader Water; se conservan normales de textura.'); }
      fragmentShader = fragmentShader.replace(foamTag, `
      vec3 outgoingLight = albedo;
      float crestFoamNoise = texture2D(normalSampler, (worldPosition.xz + vec2(time * 1.25, -time * 0.86)) * 0.052).r;
      float crestFoam = smoothstep(0.75 * uWaveStrength, 1.03 * uWaveStrength, worldPosition.y);
      crestFoam *= smoothstep(0.40, 0.62, crestFoamNoise);
      crestFoam *= 1.0 - smoothstep(135.0, 500.0, distance);
      outgoingLight = mix(outgoingLight, vec3(0.68, 0.79, 0.77), crestFoam * 0.22 * uFoamStrength);
      float oceanHaze = smoothstep(260.0, 1100.0, distance);
      outgoingLight = mix(outgoingLight, vec3(0.20, 0.145, 0.12), oceanHaze * 0.28);`);
      fragmentShader = fragmentShader.replace('float rf0 = 0.3;', 'float rf0 = 0.055;');
    } else {
      console.warn('Water.js cambió la salida del fragment shader; se omiten espuma y normales de oleaje.');
    }
    water.material.vertexShader = vertexShader;
    water.material.fragmentShader = fragmentShader;
    water.material.uniforms.uWaveStrength = { value: settings.waves };

      const resize=()=>{canvas.width=Math.floor(window.innerWidth*dpr);canvas.height=Math.floor(window.innerHeight*dpr);canvas.style.width='100%';canvas.style.height='100%';gl.viewport(0,0,canvas.width,canvas.height);};window.addEventListener('resize',resize,{passive:true});resize();
      const start=performance.now();let last=start;
      function draw(now){const dt=(now-last)/1000;last=now;const t=(now-start)/1000;gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(program);gl.uniform2f(loc.resolution,canvas.width,canvas.height);gl.uniform1f(loc.time,t);gl.uniform1f(loc.wind,settings.wind);gl.uniform1f(loc.waves,settings.waves);gl.uniform1f(loc.foam,settings.foam);gl.uniform3f(loc.sun,.391,.0393,-.920);gl.uniform1f(loc.yaw,view.yaw);gl.uniform1f(loc.pitch,view.pitch);gl.uniform1f(loc.height,view.height);gl.uniform1f(loc.zoom,view.z);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);updateFps(dt);requestAnimationFrame(draw);}requestAnimationFrame(draw);
    }catch(e){console.error(e);statusText.textContent='ERROR DE SHADER';statusDot.style.background='#e07070';renderMode.textContent='NO SE PUDO COMPILAR EL SHADER';}
  }
  init();
})();
</script>
